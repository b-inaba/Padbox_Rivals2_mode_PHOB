name: Build Padbox Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Phob firmware
        uses: actions/checkout@v4

      - name: Install ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Download Pico SDK
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git $RUNNER_TEMP/pico-sdk
          git -C $RUNNER_TEMP/pico-sdk submodule update --init --recursive

      - name: Build firmware
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S PhobGCC/rp2040 -B build -G Ninja
          cmake --build build

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: Padbox-Phob-Firmware
          path: build/phobgcc_rp2040.uf2